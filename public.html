<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnier Display</title>
    <style>
        :root { --bg: #e9ecef; --surface: #ffffff; --primary: #0056b3; --text: #222222; --border: #ced4da; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        .view { display: none; min-height: 100vh; padding: 40px; box-sizing: border-box; }
        #active-phase { display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; height: 100vh; }
        #round-title { position: absolute; top: 30px; left: 40px; font-size: 2.5vw; color: #888; font-weight: bold; text-transform: uppercase; }
        #timer { font-size: 28vw; font-weight: bold; line-height: 1; margin: 0; color: #111; font-variant-numeric: tabular-nums; transition: color 0.5s; margin-bottom: 8vh; }
        .timer-yellow { color: #ffc107 !important; } .timer-red { color: #dc3545 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }
        .current-matches { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--primary); color: white; padding: 2vh 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; font-size: 2.5vw; font-weight: bold; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); }
        .pause-view { display: flex; flex-direction: column; gap: 40px; }
        .section-title { width: 100%; text-align: center; color: var(--primary); font-size: 2.5em; text-transform: uppercase; border-bottom: 3px solid var(--border); padding-bottom: 10px; margin: 0; }
        .card { background: var(--surface); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; min-width: 300px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 1.3em; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
        th { color: #666; font-size: 0.9em; text-transform: uppercase; }
        .badge { display: inline-block; width: 20px; height: 20px; border-radius: 50%; margin-right: 12px; vertical-align: middle; border: 2px solid rgba(0,0,0,0.1); }
        .bracket-container { display: flex; justify-content: center; align-items: stretch; width: 100%; gap: 15px; padding: 20px 0; height: 550px; }
        .bracket-col { display: flex; flex-direction: column; width: 22%; justify-content: space-around; }
        .match-box { background: white; border-radius: 6px; border: 2px solid #ccc; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .finale-box { border: 4px solid #f1c40f; box-shadow: 0 0 20px rgba(241,196,15,0.4); transform: scale(1.05); z-index: 10; }
        .team-line { display: flex; justify-content: space-between; align-items: center; padding: 5px; font-weight: bold; font-size: 1.1em; border-radius: 4px; }
        .team-winner { background: #d4edda; color: #155724; }
        .team-loser { opacity: 0.4; text-decoration: line-through; }
        .score-box { background: rgba(0,0,0,0.08); padding: 2px 8px; border-radius: 4px; min-width: 25px; text-align: center; }
        .podium-container { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 75vh; gap: 2vw; }
        .podium-step { display: flex; flex-direction: column; align-items: center; width: 28%; text-align: center; border-radius: 15px 15px 0 0; position: relative; box-shadow: inset 0 0 30px rgba(0,0,0,0.3); }
        .podium-team-name { font-size: 3.5vw; font-weight: 800; color: #111; margin-bottom: 15px; line-height: 1.1; }
        .podium-rank { margin-top: auto; margin-bottom: 3vh; font-size: 8vw; font-weight: 900; color: white; }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #waiting-screen { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 3em; color: #666; font-weight: bold; }
    </style>
</head>
<body>

<audio id="horn-sound" src="sound.mp3" preload="auto"></audio>
<div id="waiting-screen">Warte auf Turnier-Start...</div>

<div id="active-phase" class="view">
    <div id="round-title">Aktuelle Spiele</div>
    <div id="timer">12:00</div>
    <div id="current-matches-display" class="current-matches"></div>
</div>

<div id="pause-phase" class="view pause-view">
    <div id="groups-wrapper">
        <h1 class="section-title">Gruppenphase</h1>
        <div id="tables-content" style="display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; justify-content:center;"></div>
    </div>
    <div id="bracket-wrapper" style="display:none;">
        <h1 class="section-title">Die K.O.-Phase</h1>
        <div id="bracket-content" class="bracket-container"></div>
    </div>
</div>

<div id="finished-phase" class="view" style="flex-direction:column;">
    <h1 style="font-size: 4vw; color: var(--primary); text-align: center; margin: 0;">🏆 Siegerehrung 🏆</h1>
    <div id="podium-area" style="width:100%; flex-grow:1; display:flex;"></div>
</div>

<script>
    const bc = new BroadcastChannel('tournament_channel');
    let currentState = null;

    bc.onmessage = (event) => {
        if(event.data.type === 'STATE_UPDATE') { currentState = event.data.state; render(); }
        if(event.data.type === 'TIMER_TICK') updateTimerDisplay(event.data.time);
        if(event.data.type === 'HORN') { document.body.style.backgroundColor = "#ffc107"; document.getElementById('horn-sound').play().catch(()=>{}); setTimeout(() => document.body.style.backgroundColor = "var(--bg)", 1000); }
    };

    function updateTimerDisplay(seconds) {
        let m = Math.floor(seconds / 60).toString().padStart(2, '0'); let s = (seconds % 60).toString().padStart(2, '0');
        const timerEl = document.getElementById('timer'); timerEl.innerText = `${m}:${s}`;
        timerEl.className = (seconds <= 60) ? 'timer-red' : (seconds <= 300 ? 'timer-yellow' : '');
    }

    function render() {
        document.getElementById('waiting-screen').style.display = 'none';
        const phase = currentState.phase; const stage = currentState.stage;
        document.getElementById('active-phase').style.display = (phase === 'active' && stage !== 'finished') ? 'flex' : 'none';
        document.getElementById('pause-phase').style.display = (phase === 'pause' && stage !== 'finished') ? 'flex' : 'none';
        document.getElementById('finished-phase').style.display = (stage === 'finished') ? 'flex' : 'none';
        if(stage === 'finished') renderSiegerehrung();
        else if(phase === 'pause') {
            if(stage === 'ko') { document.getElementById('groups-wrapper').style.display = 'none'; document.getElementById('bracket-wrapper').style.display = 'block'; renderBracket(); }
            else { document.getElementById('groups-wrapper').style.display = 'block'; document.getElementById('bracket-wrapper').style.display = 'none'; renderTables(); }
        } else renderActiveMatches();
    }

    function renderActiveMatches() {
        const slot = currentState.timeslots[currentState.currentSlot];
        document.getElementById('round-title').innerText = slot.name || `Runde ${currentState.currentSlot+1}`;
        let html = '';
        slot.matches.forEach(m => {
            html += `<div style="display:flex; align-items:center;"><span style="font-size: 0.7em; margin-right: 10px; opacity:0.7;">${m.koRound || 'SPIEL'}:</span><span class="badge" style="background:${m.t1.color}; border:2px solid white;"></span><span class="truncate">${m.t1.name}</span><span style="margin: 0 10px; opacity:0.5;">vs</span><span class="truncate">${m.t2.name}</span><span class="badge" style="background:${m.t2.color}; border:2px solid white; margin-left:8px;"></span></div>`;
        });
        document.getElementById('current-matches-display').innerHTML = html;
    }

    function renderTables() {
        let html = '';
        currentState.groups.forEach((group, i) => {
            let sorted = [...group].map(t => currentState.teams.find(st => st.id === t.id)).sort((a, b) => b.points - a.points || b.diff - a.diff);
            html += `<div class="card"><h3>Gruppe ${String.fromCharCode(65+i)}</h3><table><tr><th>Team</th><th>Sp</th><th>Pkt</th><th>Diff</th></tr>`;
            sorted.forEach((t, idx) => html += `<tr><td><span class="badge" style="background:${t.color}"></span><span class="truncate" style="max-width:120px;">${t.name}</span></td><td>${t.played}</td><td>${t.points}</td><td>${t.diff>0?'+'+t.diff:t.diff}</td></tr>`);
            html += `</table></div>`;
        });
        document.getElementById('tables-content').innerHTML = html;
    }

    function getMatches(name) { let res = []; currentState.timeslots.forEach(s => s.matches.forEach(m => { if(m.koRound === name) res.push(m); })); return res; }

    function createMB(m, isFinale = false) {
        if(!m) return `<div class="match-box" style="opacity:0.3; text-align:center;">TBD</div>`;
        let s1 = m.score1??'-', s2 = m.score2??'-';
        let w1 = m.score1 > m.score2 ? 'team-winner' : (m.score1 < m.score2 ? 'team-loser' : '');
        let w2 = m.score2 > m.score1 ? 'team-winner' : (m.score2 < m.score1 ? 'team-loser' : '');
        return `<div class="match-box ${isFinale?'finale-box':''}"><div class="team-line ${w1}"><span class="badge" style="background:${m.t1.color}"></span><span class="truncate" style="max-width:100px;">${m.t1.name}</span><div class="score-box">${s1}</div></div><div style="border-top:1px solid #ddd; margin:3px 0;"></div><div class="team-line ${w2}"><span class="badge" style="background:${m.t2.color}"></span><span class="truncate" style="max-width:100px;">${m.t2.name}</span><div class="score-box">${s2}</div></div></div>`;
    }

    function renderBracket() {
        let html = '', bs = currentState.bracket.size;
        let vf = getMatches('Viertelfinale'), zr = getMatches('Zwischenrunde'), hf = getMatches('Halbfinale'), fin = getMatches('Finale'), p3 = getMatches('Platz 3');

        // LINKE SPALTE (VF oder ZR)
        html += `<div class="bracket-col"><h3>${bs===6?'ZR (Play-off)':'Viertelfinale'}</h3>`;
        if(bs===6) html += createMB(zr[0]); else { html += createMB(vf[0]); html += createMB(vf[1]); }
        html += `</div>`;

        // MITTE LINKS (HF)
        html += `<div class="bracket-col"><h3>Halbfinale</h3>${createMB(hf[0])}</div>`;

        // ZENTRUM (FINALE)
        html += `<div class="bracket-col" style="width:30%; background:rgba(0,0,0,0.02); border-radius:10px; padding:10px;"><h2>🏆 Finale</h2>${createMB(fin[0], true)}<h4 style="margin-top:20px; color:#888;">Platz 3</h4>${createMB(p3[0])}</div>`;

        // MITTE RECHTS (HF)
        html += `<div class="bracket-col"><h3>Halbfinale</h3>${createMB(hf[1])}</div>`;

        // RECHTE SPALTE (VF oder ZR)
        html += `<div class="bracket-col"><h3>${bs===6?'ZR (Play-off)':'Viertelfinale'}</h3>`;
        if(bs===6) html += createMB(zr[1]); else { html += createMB(vf[2]); html += createMB(vf[3]); }
        html += `</div>`;

        document.getElementById('bracket-content').innerHTML = html;
    }

    function renderSiegerehrung() {
        let fin = getMatches('Finale')[0], p3 = getMatches('Platz 3')[0];
        if(!fin || fin.score1 === null) return;
        let first = fin.score1 > fin.score2 ? fin.t1 : fin.t2, second = fin.score1 < fin.score2 ? fin.t1 : fin.t2, third = p3 && p3.score1 !== null ? (p3.score1 > p3.score2 ? p3.t1 : p3.t2) : null;
        let html = `<div class="podium-container">
            <div class="podium-step step-2" style="background:${second.color}"><div class="podium-team-name">${second.name}</div><div class="podium-rank">2.</div></div>
            <div class="podium-step step-1" style="background:${first.color}"><div class="podium-team-name">${first.name}</div><div class="podium-rank">1.</div></div>`;
        if(third) html += `<div class="podium-step step-3" style="background:${third.color}"><div class="podium-team-name">${third.name}</div><div class="podium-rank">3.</div></div>`;
        html += `</div>`;
        document.getElementById('podium-area').innerHTML = html;
    }
</script>
</body>
</html>
