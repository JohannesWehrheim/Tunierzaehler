<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnier Display</title>
    <style>
        :root { --bg: #e9ecef; --surface: #ffffff; --primary: #0056b3; --text: #222222; --border: #ced4da; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        .view { display: none; min-height: 100vh; padding: 40px; box-sizing: border-box; }
        
        /* NEU: Split-Screen Layout für Active Phase (Timer + Mini Tabellen) */
        #active-phase { display: flex; flex-direction: row; justify-content: space-between; align-items: stretch; padding: 0; height: 100vh; }
        #active-main { flex: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #mini-tables-sidebar { flex: 1; background: var(--surface); border-left: 3px solid var(--border); padding: 20px; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.05); }
        
        .mini-table { width: 100%; border-collapse: collapse; font-size: 0.9em; margin-bottom: 20px; }
        .mini-table th, .mini-table td { padding: 5px; border-bottom: 1px solid #eee; text-align: left; }
        .mini-table th { color: var(--primary); font-size: 0.8em; }
        .mini-table h4 { margin: 0 0 5px 0; color: #666; font-size: 1.1em; }

        #round-title { position: absolute; top: 30px; left: 40px; font-size: 2vw; color: #888; margin: 0; font-weight: bold; text-transform: uppercase; }
        #timer { font-size: 22vw; font-weight: bold; line-height: 1; margin: 0; color: #111; font-variant-numeric: tabular-nums; transition: color 0.5s; margin-bottom: 10vh; }
        .timer-yellow { color: #ffc107 !important; } .timer-red { color: #dc3545 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }
        
        .current-matches { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--primary); color: white; padding: 2vh 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; font-size: 2vw; font-weight: bold; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); }
        
        .pause-view { display: flex; flex-direction: column; gap: 40px; }
        .flex-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; }
        .section-title { width: 100%; text-align: center; color: var(--primary); font-size: 2.5em; margin: 0; text-transform: uppercase; border-bottom: 3px solid var(--border); padding-bottom: 10px; }
        .card { background: var(--surface); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; min-width: 300px; max-width: 500px; border: 1px solid var(--border); }
        .card h3 { color: var(--primary); margin-top: 0; text-align: center; font-size: 1.5em; }
        
        table { width: 100%; border-collapse: collapse; font-size: 1.3em; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
        th { color: #666; font-size: 0.9em; text-transform: uppercase; }
        .badge { display: inline-block; width: 20px; height: 20px; border-radius: 50%; margin-right: 12px; vertical-align: middle; border: 2px solid rgba(0,0,0,0.1); flex-shrink: 0; }
        
        .bracket-container { display: flex; justify-content: center; align-items: stretch; width: 100%; gap: 15px; padding: 20px 0; height: 500px; }
        .bracket-col { display: flex; flex-direction: column; width: 22%; }
        .match-wrapper { flex-grow: 1; display: flex; flex-direction: column; }
        .match-wrapper.space-around { justify-content: space-around; }
        .match-wrapper.center { justify-content: center; }
        .center-col { width: 25%; align-items: center; justify-content: center; background: rgba(0,86,179,0.03); border-radius: 12px; padding: 20px; border: 2px dashed #0056b3; }
        .match-box { background: white; border-radius: 6px; border: 2px solid #ccc; padding: 10px; display: flex; flex-direction: column; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .finale-box { border: 3px solid #f1c40f; box-shadow: 0 0 20px rgba(241,196,15,0.4); transform: scale(1.05); z-index: 10; }
        .empty-match { opacity: 0.5; border-style: dashed; justify-content: center; align-items: center; font-style: italic; color: #888; height: 80px; }
        .team-line { display: flex; justify-content: space-between; align-items: center; padding: 5px; font-weight: bold; font-size: 1.1em; border-radius: 4px; }
        .team-winner { background: #d4edda; color: #155724; }
        .team-loser { opacity: 0.4; text-decoration: line-through; }
        .score-box { background: rgba(0,0,0,0.08); padding: 2px 8px; border-radius: 4px; min-width: 25px; text-align: center; color: #333; font-family: monospace; font-size: 1.1em; margin-left: 10px; }
        
        #finished-phase { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100vh; }
        .podium-container { display: flex; align-items: flex-end; justify-content: center; width: 100%; flex-grow: 1; gap: 2vw; margin-top: 2vh; margin-bottom: 2vh; }
        .podium-step { display: flex; flex-direction: column; align-items: center; width: 28%; text-align: center; border-radius: 15px 15px 0 0; position: relative; box-shadow: inset 0 0 30px rgba(0,0,0,0.3), 0 -10px 25px rgba(0,0,0,0.15); transition: height 0.5s ease-out; }
        .podium-team-name { font-size: 3.5vw; font-weight: 800; color: #111; margin-bottom: 15px; line-height: 1.1; width: 100%; word-wrap: break-word; hyphens: auto; text-shadow: 0 2px 4px rgba(255,255,255,0.5); }
        .step-2 { height: 65%; } .step-1 { height: 95%; z-index: 10; } .step-3 { height: 45%; }
        .podium-rank { margin-top: auto; margin-bottom: 3vh; font-size: 8vw; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.4); font-family: 'Arial Black', Gadget, sans-serif; }
        .step-1 .podium-rank { font-size: 10vw; margin-bottom: 4vh; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.4); }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #waiting-screen { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 3em; color: #666; font-weight: bold; }
        
        #coin-toss-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
    </style>
</head>
<body>

<audio id="horn-sound" src="sound.mp3" preload="auto"></audio>
<div id="waiting-screen">Warte auf Verbindung zum Turnierleiter...</div>

<div id="coin-toss-overlay">
    <h1 style="color: #dc3545; font-size: 6vw; text-transform: uppercase; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">⚠️ Exakter Gleichstand ⚠️</h1>
    <h3 style="font-size: 3vw; font-weight: normal; margin-bottom: 50px;">Turnierleitung ermittelt Sieger (Tie-Breaker)</h3>
</div>

<div id="active-phase" class="view">
    <div id="active-main">
        <div id="round-title">Aktuelle Spiele</div>
        <div id="timer">12:00</div>
        <div id="current-matches-display" class="current-matches"></div>
    </div>
    <div id="mini-tables-sidebar"></div>
</div>

<div id="pause-phase" class="view pause-view">
    <div id="groups-wrapper">
        <h1 class="section-title">Gruppenphase</h1>
        <div id="tables-content" class="flex-container" style="margin-top: 20px;"></div>
    </div>
    <div id="bracket-wrapper" style="display:none;">
        <h1 class="section-title">Die K.O.-Phase</h1>
        <div id="bracket-content" class="bracket-container"></div>
    </div>
    <div style="margin-top: 20px;" id="schedule-wrapper">
        <h1 class="section-title" id="schedule-title">Spielplan</h1>
        <div id="schedule-content" class="flex-container" style="margin-top: 20px;"></div>
    </div>
</div>

<div id="finished-phase" class="view">
    <h1 style="font-size: 3.5vw; color: var(--primary); text-align: center; margin: 0; text-transform: uppercase; letter-spacing: 2px;">🏆 Siegerehrung 🏆</h1>
    <div id="podium-area" style="width:100%; flex-grow:1; display:flex;"></div>
</div>

<script>
    const bc = new BroadcastChannel('tournament_channel');
    let currentState = null;

    window.onload = () => { bc.postMessage({ type: 'REQUEST_STATE' }); };

    bc.onmessage = (event) => {
        if(event.data.type === 'STATE_UPDATE') { currentState = event.data.state; render(); }
        if(event.data.type === 'TIMER_TICK') updateTimerDisplay(event.data.time);
        if(event.data.type === 'COIN_TOSS_START') document.getElementById('coin-toss-overlay').style.display = 'flex';
        if(event.data.type === 'COIN_TOSS_END') document.getElementById('coin-toss-overlay').style.display = 'none';
        if(event.data.type === 'HORN') { 
            document.body.style.backgroundColor = "#ffc107"; 
            document.getElementById('horn-sound').play().catch(()=>{});
            setTimeout(() => document.body.style.backgroundColor = "var(--bg)", 1000); 
        }
    };

    function updateTimerDisplay(seconds) {
        let m = Math.floor(seconds / 60).toString().padStart(2, '0'); let s = (seconds % 60).toString().padStart(2, '0');
        const timerEl = document.getElementById('timer'); timerEl.innerText = `${m}:${s}`;
        timerEl.className = (seconds <= 60) ? 'timer-red' : (seconds <= 300 ? 'timer-yellow' : '');
    }

    function render() {
        if(!currentState) return;
        document.getElementById('waiting-screen').style.display = 'none';
        
        const phase = currentState.phase; const stage = currentState.stage; 

        document.getElementById('active-phase').style.display = (phase === 'active' && stage !== 'finished') ? 'flex' : 'none';
        document.getElementById('pause-phase').style.display = (phase === 'pause' && stage !== 'finished') ? 'flex' : 'none';
        document.getElementById('finished-phase').style.display = (stage === 'finished') ? 'flex' : 'none';

        if(stage === 'finished') renderSiegerehrung();
        else if(phase === 'pause') {
            if(stage === 'ko') {
                document.getElementById('groups-wrapper').style.display = 'none';
                document.getElementById('schedule-wrapper').style.display = 'none';
                document.getElementById('bracket-wrapper').style.display = 'block';
                renderBracket();
            } else {
                document.getElementById('groups-wrapper').style.display = 'block';
                document.getElementById('schedule-wrapper').style.display = 'block';
                document.getElementById('bracket-wrapper').style.display = 'none';
                renderTables(); renderSchedule();
            }
        } else {
            renderActiveMatches(); renderMiniTables(); updateTimerDisplay(currentState.timeRemaining);
        }
    }

    function renderActiveMatches() {
        if(currentState.currentSlot >= currentState.timeslots.length) return;
        const slot = currentState.timeslots[currentState.currentSlot];
        document.getElementById('round-title').innerText = slot.name ? slot.name : `Runde ${currentState.currentSlot + 1}`;
        let html = '';
        slot.matches.forEach((m, i) => {
            let info = m.koRound ? m.koRound.toUpperCase() : `FELD ${i+1}`;
            html += `<div style="display:flex; align-items:center; max-width: 45%;">
                        <span style="color: rgba(255,255,255,0.7); font-size: 0.7em; margin-right: 15px;">${info}:</span> 
                        <span class="badge" style="background:${m.t1.color}; border: 2px solid white;"></span><span class="truncate">${m.t1.name}</span> 
                        <span style="color: rgba(255,255,255,0.5); font-size: 0.8em; margin: 0 15px;">vs</span> 
                        <span class="truncate">${m.t2.name}</span><span class="badge" style="background:${m.t2.color}; border: 2px solid white; margin-left:12px;"></span>
                     </div>`;
        });
        document.getElementById('current-matches-display').innerHTML = html;
    }

    function renderMiniTables() {
        if(currentState.stage === 'ko') { document.getElementById('mini-tables-sidebar').style.display = 'none'; return; }
        document.getElementById('mini-tables-sidebar').style.display = 'block';
        
        let html = '';
        currentState.groups.forEach((group, i) => {
            let sortedTeams = [...group].map(t => currentState.teams.find(st => st.id === t.id)).sort((a, b) => {
                let pA = a.played > 0 ? a.points/a.played : 0; let pB = b.played > 0 ? b.points/b.played : 0;
                if(pB !== pA) return pB - pA;
                return (b.played > 0 ? b.diff/b.played : 0) - (a.played > 0 ? a.diff/a.played : 0);
            });
            html += `<h4>Gruppe ${String.fromCharCode(65 + i)}</h4><table class="mini-table"><tr><th>Pl</th><th>Team</th><th>Pkt</th><th>Diff</th></tr>`;
            sortedTeams.forEach((t, idx) => {
                html += `<tr><td>${idx+1}.</td><td><span class="badge" style="background:${t.color}; width:10px; height:10px; border:1px solid #ccc;"></span><span class="truncate" style="max-width:80px;">${t.name}</span></td><td>${Math.floor(t.points)}</td><td>${t.diff > 0 ? '+'+t.diff : t.diff}</td></tr>`;
            });
            html += `</table>`;
        });
        document.getElementById('mini-tables-sidebar').innerHTML = html;
    }

    function renderTables() {
        let html = '';
        currentState.groups.forEach((group, i) => {
            let sortedTeams = [...group].map(t => currentState.teams.find(st => st.id === t.id)).sort((a, b) => {
                let pA = a.played > 0 ? a.points/a.played : 0; let pB = b.played > 0 ? b.points/b.played : 0;
                if(pB !== pA) return pB - pA;
                return (b.played > 0 ? b.diff/b.played : 0) - (a.played > 0 ? a.diff/a.played : 0);
            });
            html += `<div class="card"><h3>Gruppe ${String.fromCharCode(65 + i)}</h3><table><tr><th>Team</th><th>Sp</th><th>Pkt</th><th>Diff</th></tr>`;
            sortedTeams.forEach((t, idx) => {
                html += `<tr><td><div style="display:flex; align-items:center;"><strong style="color:#999; margin-right:10px;">${idx+1}.</strong><span class="badge" style="background:${t.color}"></span><strong class="truncate" style="max-width: 150px;">${t.name}</strong></div></td><td>${t.played}</td><td><strong>${Math.floor(t.points)}</strong></td><td>${t.diff > 0 ? '+'+t.diff : t.diff}</td></tr>`;
            });
            html += `</table></div>`;
        });
        document.getElementById('tables-content').innerHTML = html;
    }

    function renderSchedule() {
        let html = ''; const start = currentState.currentSlot;
        for(let offset = 0; offset < 2; offset++) {
            const slotIdx = start + offset;
            if(slotIdx < currentState.timeslots.length) {
                const slot = currentState.timeslots[slotIdx]; const title = slot.name ? slot.name : `Runde ${slotIdx + 1}`;
                html += `<div class="card"><h3>${offset === 0 ? 'Als Nächstes' : 'Danach'} (${title})</h3><table>`;
                slot.matches.forEach((m, i) => {
                    let info = m.koRound ? m.koRound.toUpperCase() : `Feld ${i+1}`;
                    html += `<tr><td style="color:#666; width: 140px; font-weight:bold;">${info}</td>
                                 <td><div style="display:flex; align-items:center;"><span class="badge" style="background:${m.t1.color}"></span><strong class="truncate" style="max-width:120px; font-size: 1.2em;">${m.t1.name}</strong> <span style="color:#999; font-size:0.8em; margin:0 15px;">vs</span> <strong class="truncate" style="max-width:120px; font-size: 1.2em;">${m.t2.name}</strong><span class="badge" style="background:${m.t2.color}"></span></div></td></tr>`;
                });
                html += `</table></div>`;
            }
        }
        document.getElementById('schedule-content').innerHTML = html;
    }

    function getMatchesFromHistory(roundName) {
        let res = [];
        for (let i = 0; i < currentState.timeslots.length; i++) {
            currentState.timeslots[i].matches.forEach(m => { if(m.koRound === roundName) res.push(m); });
        }
        return res;
    }

    function createMatchBox(m, isFinale = false) {
        if(!m) return `<div class="match-box empty-match">TBD</div>`;
        let s1 = m.score1 !== null ? m.score1 : '-'; let s2 = m.score2 !== null ? m.score2 : '-';
        let w1 = m.score1 !== null && m.score1 > m.score2 ? 'team-winner' : (m.score1 !== null && m.score1 < m.score2 ? 'team-loser' : '');
        let w2 = m.score2 !== null && m.score2 > m.score1 ? 'team-winner' : (m.score2 !== null && m.score2 < m.score1 ? 'team-loser' : '');
        let finClass = isFinale ? 'finale-box' : '';
        
        return `<div class="match-box ${finClass}">
            <div class="team-line ${w1}">
                <div style="display:flex; align-items:center; overflow:hidden; padding-right: 10px;">
                    <span class="badge" style="background:${m.t1.color}"></span><span class="truncate" style="max-width: 100px;">${m.t1.name}</span>
                </div>
                <div class="score-box">${s1}</div>
            </div>
            <div style="border-top:1px solid var(--border); margin: 3px 0;"></div>
            <div class="team-line ${w2}">
                <div style="display:flex; align-items:center; overflow:hidden; padding-right: 10px;">
                    <span class="badge" style="background:${m.t2.color}"></span><span class="truncate" style="max-width: 100px;">${m.t2.name}</span>
                </div>
                <div class="score-box">${s2}</div>
            </div>
        </div>`;
    }

    function renderBracket() {
        if(!currentState.bracket) return;
        let html = '';
        let vf = getMatchesFromHistory('Viertelfinale'); let zr = getMatchesFromHistory('Zwischenrunde');
        let hf = getMatchesFromHistory('Halbfinale'); 
        let fin = getMatchesFromHistory('Finale'); let p3 = getMatchesFromHistory('Platz 3');

        if(currentState.bracket.size === 8 || currentState.bracket.size === 6) {
            let title = currentState.bracket.size === 6 ? 'Play-Offs' : 'Viertelfinale';
            let m1 = currentState.bracket.size === 6 ? zr[0] : vf[0];
            let m2 = currentState.bracket.size === 6 ? null : vf[1]; 
            html += `<div class="bracket-col"><h3 style="text-align:center; color:#888;">${title}</h3>
                     <div class="match-wrapper space-around">${createMatchBox(m1)} ${currentState.bracket.size===8 ? createMatchBox(m2) : ''}</div></div>`;
        }
        
        html += `<div class="bracket-col"><h3 style="text-align:center; color:#888;">Halbfinale</h3>
                 <div class="match-wrapper center">${createMatchBox(hf[0])}</div></div>`;

        html += `<div class="bracket-col center-col">
                    <h2 style="margin:0 0 10px 0; color:var(--primary); font-size:2em;">🏆 Finale</h2>
                    ${createMatchBox(fin[0], true)}
                    ${p3.length > 0 ? `<h4 style="margin: 25px 0 5px 0; color:#888;">Spiel um Platz 3</h4>${createMatchBox(p3[0])}` : ''}
                 </div>`;

        html += `<div class="bracket-col"><h3 style="text-align:center; color:#888;">Halbfinale</h3>
                 <div class="match-wrapper center">${createMatchBox(hf[1])}</div></div>`;

        if(currentState.bracket.size === 8 || currentState.bracket.size === 6) {
            let title = currentState.bracket.size === 6 ? 'Play-Offs' : 'Viertelfinale';
            let m1 = currentState.bracket.size === 6 ? zr[1] : vf[2]; 
            let m2 = currentState.bracket.size === 6 ? null : vf[3];
            html += `<div class="bracket-col"><h3 style="text-align:center; color:#888;">${title}</h3>
                     <div class="match-wrapper space-around">${createMatchBox(m1)} ${currentState.bracket.size===8 ? createMatchBox(m2) : ''}</div></div>`;
        }

        document.getElementById('bracket-content').innerHTML = html;
    }

    function renderSiegerehrung() {
        let fin = getMatchesFromHistory('Finale')[0]; let p3 = getMatchesFromHistory('Platz 3')[0];
        let first, second, third;
        
        if(fin && fin.score1 !== null) {
            first = fin.score1 > fin.score2 ? fin.t1 : fin.t2; second = fin.score1 < fin.score2 ? fin.t1 : fin.t2;
        }
        if(p3 && p3.score1 !== null) {
            third = p3.score1 > p3.score2 ? p3.t1 : p3.t2;
        }

        let html = '';
        if(first && second) {
            html = `<div class="podium-container">
                        <div class="podium-step step-2" style="background-color: ${second.color};">
                            <div class="podium-team-name">${second.name}</div>
                            <div class="podium-rank">2.</div>
                        </div>
                        <div class="podium-step step-1" style="background-color: ${first.color};">
                            <div class="podium-team-name">${first.name}</div>
                            <div class="podium-rank">1.</div>
                        </div>`;
            if(third) {
                html += `<div class="podium-step step-3" style="background-color: ${third.color};">
                            <div class="podium-team-name">${third.name}</div>
                            <div class="podium-rank">3.</div>
                        </div>`;
            }
            html += `</div>`;
        } else {
            html = `<div style="text-align:center; font-size: 3em; padding: 100px; width:100%;">Warte auf Final-Ergebnisse...</div>`;
        }
        document.getElementById('podium-area').innerHTML = html;
    }
</script>
</body>
</html>
