<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnier Manager - Admin</title>
    <style>
        :root { --bg: #1e1e2f; --surface: #2a2a40; --primary: #00d2ff; --text: #ffffff; --red: #ff3366; --green: #33ff57;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--surface); padding: 20px; border-radius: 12px; }
        h1, h2 { text-align: center; color: var(--primary); }
        button { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { opacity: 0.8; }
        .btn-red { background: var(--red); color: white; }
        .btn-green { background: var(--green); color: black; }
        input, select { padding: 10px; margin: 5px; border-radius: 6px; border: 1px solid #555; background: #333; color: white; }
        .team-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        #dashboard { display: none; }
        .match-card { background: #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .match-inputs input { width: 50px; text-align: center; font-size: 1.2em; }
        .timer-box { text-align: center; font-size: 48px; font-weight: bold; margin: 10px 0; }
        .badge { display: inline-block; width: 15px; height: 15px; border-radius: 50%; margin-right: 10px; }
        .scroll-box { max-height: 400px; overflow-y: auto; padding-right: 10px; background: #222; padding: 15px; border-radius: 8px; margin-top: 10px; }
        .history-card { background: #444; opacity: 0.8; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .ko-builder-box { background: #1a1a24; padding: 20px; border-radius: 8px; border: 2px dashed var(--primary); margin-top: 20px; }
    </style>
</head>
<body>

<div class="container" id="setup-screen">
    <h1>🏆 Turnier Setup</h1>
    <button onclick="window.open('public.html', '_blank')" style="width: 100%; margin-bottom: 20px;">📺 Public Display öffnen</button>
    
    <div id="resume-box" style="display:none; background: #33ff5722; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        <p>Es wurde ein laufendes Turnier gefunden!</p>
        <button onclick="resumeTournament()" class="btn-green">Turnier fortsetzen</button>
        <button onclick="clearStorage()" class="btn-red">Neues Turnier starten</button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div>
            <label>Spielfelder:</label><br>
            <input type="number" id="num-fields" value="2" min="1" max="10" style="width: 80%;">
        </div>
        <div>
            <label>Max. Teams pro Gruppe:</label><br>
            <input type="number" id="max-group-size" value="5" min="3" max="10" style="width: 80%;">
        </div>
    </div>

    <h2 style="margin-top: 30px;">Team Eingabe</h2>
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <label>Anzahl Teams:</label>
        <input type="number" id="team-count-input" value="4" min="4" max="50" style="width: 60px;" onchange="syncTeamCount(this.value)">
        <button onclick="addTeams(1)">+1</button>
        <button onclick="addTeams(5)">+5</button>
        <button onclick="addTeams(10)">+10</button>
    </div>

    <div id="team-inputs" class="scroll-box"></div>
    <button onclick="startTournament()" style="width: 100%; margin-top: 20px; font-size: 1.2em;" class="btn-green">🚀 Turnier Generieren & Starten</button>
</div>

<div class="container" id="dashboard">
    <div class="top-bar">
        <h1>👑 Admin Panel</h1>
        <div>
            <button onclick="window.open('public.html', '_blank')">📺 Screen öffnen</button>
            <button onclick="showSettings()">⚙️ Einstellungen</button>
        </div>
    </div>

    <div id="settings-menu" style="display:none; background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h3>Timer anpassen</h3>
        Minuten: <input type="number" id="timer-minutes" value="12" style="width: 60px;">
        Sekunden: <input type="number" id="timer-seconds" value="0" style="width: 60px;">
        <button onclick="updateTimerConfig()" class="btn-green">Speichern</button>
    </div>

    <div class="timer-box">
        <span id="time-display">12:00</span><br>
        <button onclick="startTimer()">▶ Start</button>
        <button onclick="pauseTimer()">⏸ Pause</button>
        <button onclick="playHorn()" class="btn-red">🔊 Tröte</button>
    </div>

    <h2 id="round-header">Aktuelle Spiele (Runde <span id="current-round-text">1</span>)</h2>
    <div id="active-matches"></div>
    <button id="save-btn" onclick="saveResults()" style="width: 100%; margin-top: 20px; padding: 15px; font-size: 1.1em;" class="btn-green">💾 Ergebnisse eintragen & Nächste Runde</button>

    <h2 style="margin-top: 40px; color: #aaa;">Historie (Letzte Runden)</h2>
    <div id="match-history" class="scroll-box"></div>
</div>

<script>
    const COLORS = ['#FF5733', '#33FF57', '#3357FF', '#F033FF', '#33FFF0', '#FFD433', '#FF3380', '#80FF33', '#8033FF', '#FF8033', '#33FF80', '#3380FF', '#FF33D4', '#D4FF33', '#D433FF', '#33D4FF', '#A133FF', '#FF33A1', '#33FFA1', '#FFA133', '#33A1FF', '#A1FF33', '#FF5780', '#57FF80', '#ffffff'];
    let state = { teams: [], groups: [], timeslots: [], currentSlot: 0, phase: 'pause', timeRemaining: 720, defaultTime: 720, isTimerRunning: false, numFields: 2 };
    const bc = new BroadcastChannel('tournament_channel');
    let timerInterval;

    window.onload = () => {
        if(localStorage.getItem('tourney_state')) document.getElementById('resume-box').style.display = 'block';
        syncTeamCount(4); 
    };

    function clearStorage() {
        localStorage.removeItem('tourney_state');
        document.getElementById('resume-box').style.display = 'none';
    }

    function resumeTournament() {
        state = JSON.parse(localStorage.getItem('tourney_state'));
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        updateAdminView();
        updateTimeDisplay();
        broadcastState();
    }

    function addTeams(amount) { syncTeamCount(document.querySelectorAll('.team-row').length + amount); }

    function syncTeamCount(targetCount) {
        targetCount = parseInt(targetCount);
        if(targetCount > 50) targetCount = 50;
        document.getElementById('team-count-input').value = targetCount;
        const container = document.getElementById('team-inputs');
        let currentRows = container.querySelectorAll('.team-row').length;

        if (targetCount > currentRows) {
            for(let i = currentRows; i < targetCount; i++) {
                const div = document.createElement('div');
                div.className = 'team-row';
                div.innerHTML = `<span style="width: 25px; color: #888;">${i+1}.</span><input type="text" class="team-input" placeholder="Team Name" value="Team ${i+1}" style="flex-grow: 1;"><select class="team-strength"><option value="1">Schwach</option><option value="2" selected>Mittel</option><option value="3">Stark</option></select>`;
                container.appendChild(div);
            }
        } else if (targetCount < currentRows) {
            for(let i = currentRows; i > targetCount; i--) container.removeChild(container.lastChild);
        }
    }

    function startTournament() {
        const inputs = document.querySelectorAll('.team-input');
        const strengths = document.querySelectorAll('.team-strength');
        let teams = [];
        inputs.forEach((input, i) => {
            if(input.value.trim() !== '') teams.push({ id: i, name: input.value.trim(), strength: parseInt(strengths[i].value), color: COLORS[i % COLORS.length], points: 0, diff: 0, matchesPlayed: 0 });
        });

        state.numFields = parseInt(document.getElementById('num-fields').value);
        const maxGroupSize = parseInt(document.getElementById('max-group-size').value);
        let numGroups = Math.ceil(teams.length / maxGroupSize);

        teams.sort((a, b) => b.strength - a.strength);
        state.groups = Array.from({length: numGroups}, () => []);
        let dir = 1, g = 0;
        teams.forEach(t => {
            state.groups[g].push(t);
            g += dir;
            if(g >= numGroups || g < 0) { dir *= -1; g += dir; }
        });

        let groupMatches = Array.from({length: numGroups}, () => []);
        state.groups.forEach((group, gIdx) => {
            for(let i=0; i<group.length; i++) {
                for(let j=i+1; j<group.length; j++) groupMatches[gIdx].push({ t1: group[i], t2: group[j], score1: null, score2: null, isKO: false });
            }
        });

        let allMatches = [];
        let maxM = Math.max(...groupMatches.map(m => m.length));
        for(let i=0; i<maxM; i++) {
            for(let g=0; g<numGroups; g++) if(groupMatches[g][i]) allMatches.push(groupMatches[g][i]);
        }

        state.timeslots = [];
        for (let match of allMatches) {
            let placed = false;
            for (let slot of state.timeslots) {
                let teamsInSlot = slot.matches.map(m => m.t1.id).concat(slot.matches.map(m => m.t2.id));
                if (slot.matches.length < state.numFields && !teamsInSlot.includes(match.t1.id) && !teamsInSlot.includes(match.t2.id)) {
                    slot.matches.push(match); placed = true; break;
                }
            }
            if (!placed) state.timeslots.push({ matches: [match] });
        }
        
        state.teams = teams;
        localStorage.setItem('tourney_state', JSON.stringify(state));
        
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        updateAdminView();
        broadcastState();
    }

    function updateAdminView() {
        const container = document.getElementById('active-matches');
        const saveBtn = document.getElementById('save-btn');
        const roundHeader = document.getElementById('round-header');
        container.innerHTML = '';
        
        // K.O. GENERATOR WENN SLOTS ZU ENDE SIND
        if(state.currentSlot >= state.timeslots.length) {
            roundHeader.innerHTML = "Gruppenphase beendet! 🏁";
            saveBtn.style.display = 'none';
            
            let html = `
                <div class="ko-builder-box">
                    <h3 style="margin-top:0; color:var(--primary)">Nächste Begegnungen (K.O.-Phase) erstellen</h3>
                    <input type="text" id="ko-round-name" placeholder="Runden-Name (z.B. Viertelfinale, Halbfinale, Finale)" style="width: 90%; margin-bottom: 15px; font-size:1.1em;">
                    <div id="ko-match-inputs"></div>
                    <button onclick="addKOMatchRow()">+ Weiteres Spiel hinzufügen</button>
                    <button onclick="generateKO()" class="btn-green" style="width: 100%; margin-top: 15px;">K.O. Runde starten 🚀</button>
                </div>
            `;
            container.innerHTML = html;
            // Initiale zwei K.O. Reihen hinzufügen
            setTimeout(() => { addKOMatchRow(); addKOMatchRow(); }, 50);
            renderHistory();
            return;
        }

        // NORMALE SPIELANSICHT
        saveBtn.style.display = 'block';
        const slot = state.timeslots[state.currentSlot];
        roundHeader.innerHTML = slot.name ? `Aktuelle Spiele: ${slot.name}` : `Aktuelle Spiele (Runde ${state.currentSlot + 1})`;
        
        slot.matches.forEach((m, index) => {
            container.innerHTML += `
                <div class="match-card">
                    <div><strong>Feld ${index + 1}</strong></div>
                    <div style="flex-grow: 1; text-align: center;">
                        <span class="badge" style="background:${m.t1.color}"></span>${m.t1.name} 
                        <strong style="margin: 0 10px;">vs</strong> 
                        ${m.t2.name}<span class="badge" style="background:${m.t2.color}"></span>
                    </div>
                    <div class="match-inputs">
                        <input type="number" id="score1-${index}" placeholder="0"> : 
                        <input type="number" id="score2-${index}" placeholder="0">
                    </div>
                </div>
            `;
        });
        renderHistory();
    }

    // --- NEUE K.O. LOGIK ---
    function addKOMatchRow() {
        // Teams nach Punkten absteigend sortieren für einfaches Finden
        let sortedTeams = [...state.teams].sort((a, b) => b.points - a.points || b.diff - a.diff);
        let options = sortedTeams.map(t => `<option value="${t.id}">${t.name} (${t.points} Pkt)</option>`).join('');
        
        let div = document.createElement('div');
        div.className = 'team-row';
        div.style.justifyContent = 'space-between';
        div.innerHTML = `
            <select class="ko-t1" style="flex-grow:1">${options}</select> 
            <strong>vs</strong> 
            <select class="ko-t2" style="flex-grow:1">${options}</select> 
            <button onclick="this.parentElement.remove()" class="btn-red">X</button>
        `;
        document.getElementById('ko-match-inputs').appendChild(div);
    }

    function generateKO() {
        let name = document.getElementById('ko-round-name').value || 'K.O. Phase';
        let t1s = document.querySelectorAll('.ko-t1');
        let t2s = document.querySelectorAll('.ko-t2');
        let newMatches = [];
        
        for(let i = 0; i < t1s.length; i++) {
            let id1 = parseInt(t1s[i].value);
            let id2 = parseInt(t2s[i].value);
            if(id1 !== id2) {
                let t1 = state.teams.find(t => t.id === id1);
                let t2 = state.teams.find(t => t.id === id2);
                newMatches.push({ t1: t1, t2: t2, score1: null, score2: null, isKO: true });
            }
        }
        
        if(newMatches.length === 0) return alert("Bitte mindestens ein gültiges Spiel auswählen!");

        // Greedy Scheduler für die K.O. Spiele basierend auf Feldern
        let tempSlots = [];
        for (let match of newMatches) {
            let placed = false;
            for (let slot of tempSlots) {
                let teamsInSlot = slot.matches.map(m => m.t1.id).concat(slot.matches.map(m => m.t2.id));
                if (slot.matches.length < state.numFields && !teamsInSlot.includes(match.t1.id) && !teamsInSlot.includes(match.t2.id)) {
                    slot.matches.push(match); placed = true; break;
                }
            }
            if (!placed) tempSlots.push({ name: name, matches: [match] });
        }

        // Füge die neuen Slots einfach hinten an
        state.timeslots.push(...tempSlots);
        localStorage.setItem('tourney_state', JSON.stringify(state));
        updateAdminView();
        broadcastState();
    }

    function renderHistory() {
        const hist = document.getElementById('match-history');
        hist.innerHTML = '';
        for(let i = state.currentSlot - 1; i >= 0; i--) {
            let title = state.timeslots[i].name ? state.timeslots[i].name : `Runde ${i+1}`;
            let html = `<div><strong>${title}</strong></div>`;
            state.timeslots[i].matches.forEach(m => {
                html += `<div style="margin-bottom: 5px; font-size: 0.9em;">${m.t1.name} (${m.score1}) vs (${m.score2}) ${m.t2.name}</div>`;
            });
            hist.innerHTML += `<div class="match-card history-card" style="display:block;">${html}</div>`;
        }
    }

    function saveResults() {
        const slot = state.timeslots[state.currentSlot];
        slot.matches.forEach((m, index) => {
            const s1 = parseInt(document.getElementById(`score1-${index}`).value) || 0;
            const s2 = parseInt(document.getElementById(`score2-${index}`).value) || 0;
            m.score1 = s1; m.score2 = s2;
            
            let t1 = state.teams.find(t => t.id === m.t1.id);
            let t2 = state.teams.find(t => t.id === m.t2.id);
            
            // Punkte und Diff nur berechnen, wenn es KEIN K.O. Spiel ist
            if(!m.isKO) {
                t1.matchesPlayed++; t2.matchesPlayed++;
                t1.diff += (s1 - s2); t2.diff += (s2 - s1);
                if(s1 > s2) t1.points += 3;
                else if(s2 > s1) t2.points += 3;
                else { t1.points += 1; t2.points += 1; }
            }
        });
        
        state.currentSlot++;
        state.phase = 'pause';
        state.timeRemaining = state.defaultTime; 
        updateTimeDisplay();
        updateAdminView();
        
        localStorage.setItem('tourney_state', JSON.stringify(state));
        broadcastState();
    }

    function showSettings() { document.getElementById('settings-menu').style.display = document.getElementById('settings-menu').style.display === 'none' ? 'block' : 'none'; }
    function updateTimerConfig() {
        state.defaultTime = ((parseInt(document.getElementById('timer-minutes').value) || 0) * 60) + (parseInt(document.getElementById('timer-seconds').value) || 0);
        if(state.phase === 'pause') { state.timeRemaining = state.defaultTime; updateTimeDisplay(); }
        document.getElementById('settings-menu').style.display = 'none'; broadcastState();
    }
    function updateTimeDisplay() { document.getElementById('time-display').innerText = `${Math.floor(state.timeRemaining / 60).toString().padStart(2, '0')}:${(state.timeRemaining % 60).toString().padStart(2, '0')}`; }
    function startTimer() {
        if(state.isTimerRunning) return; state.phase = 'active'; state.isTimerRunning = true; broadcastState();
        timerInterval = setInterval(() => {
            if(state.timeRemaining > 0) { state.timeRemaining--; updateTimeDisplay(); bc.postMessage({ type: 'TIMER_TICK', time: state.timeRemaining }); } 
            else { pauseTimer(); playHorn(); }
        }, 1000);
    }
    function pauseTimer() { state.isTimerRunning = false; clearInterval(timerInterval); broadcastState(); }
    function playHorn() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime); gain.gain.setValueAtTime(1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5); osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 1.5); bc.postMessage({ type: 'HORN' });
    }
    function broadcastState() { bc.postMessage({ type: 'STATE_UPDATE', state: state }); }
</script>
</body>
</html>
